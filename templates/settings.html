<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Settings</h1>
        <div class="text-end mb-4">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">
                <i class="fas fa-home"></i> Home
            </a>
        </div>
        <form action="{{ url_for('settings') }}" method="POST">
            {% for setting in settings %}
            <div class="mb-3">
                <label for="{{ setting.key }}" class="form-label">{{ setting.key.replace('_', ' ').title() }}</label>
                <input type="text" class="form-control" id="{{ setting.key }}" name="{{ setting.key }}" value="{{ setting.value }}" required>
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
        <div class="mt-4">
            <form action="{{ url_for('get_users_from_splitwise') }}" method="POST">
                <button type="submit" class="btn btn-info">
                    <i class="fas fa-sync-alt"></i> Get Users from Splitwise
                </button>
            </form>
        </div>
        <div class="card mt-4">
            <div class="card-header">
                <h3>Add Family Member</h3>
            </div>
            <div class="card-body">
                <form action="{{ url_for('add_member') }}" method="POST">
                    <div class="input-group">
                        <input type="text" class="form-control" name="name" placeholder="Member Name" required>
                        <input type="text" class="form-control" name="email" placeholder="Member Splitwise email" required>
                        <button class="btn btn-primary" type="submit">Add Member</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="card mt-4">
            <div class="card-header">
                <h3>Existing Family Members</h3>
            </div>
            <div class="card-body">
                <ul class="list-group">
                    {% for member in family_members %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ member.name }} ({{ member.email }})
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
